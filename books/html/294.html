        body {
            margin: 0;

            margin: auto;

        #turn {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: white;
            display: none;
        }

        #ui {
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-family: Verdana monospace;
            color: slategray;
        }

        #savePrompt {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
        }

        #promptWindow {
            color: white;
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 25%;
        }

        #debug {
            background-color: white;
            position: absolute;
        }

        #save {
            resize: none;
            width: 100%;
            height: 100%;
        }
