name: Duplicate Template Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Build Script
        run: node build.js

      - name: Deploy to gh-pages with Git LFS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist_deploy

          # Initialize git inside the build output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure Git LFS for large files
          git lfs install
          git lfs track "books/html/fnafi/**"
          git lfs track "books/html/fnafi3/**"
          git lfs track "*.zip"
          git lfs track "*.wasm"
          git add .gitattributes

          # Add remote authentication
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Stage all files, tracking large files as LFS pointers
          git add -A
          git commit -m "Deploy 5,000 links with Git LFS"

          # Push LFS binary blobs first
          git lfs push origin HEAD --all

          # Force-push the deployment branch
          git push origin HEAD:gh-pages --force
