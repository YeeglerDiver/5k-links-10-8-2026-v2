name: Duplicate Template Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Setup Git LFS
        run: |
          git lfs install

      - name: Build 5,000 Nested Pages with Path Fixes
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist_deploy");
          if (fs.existsSync(distDir)) {
            fs.rmSync(distDir, { recursive: true, force: true });
          }
          fs.mkdirSync(distDir, { recursive: true });
          fs.writeFileSync(path.join(distDir, ".nojekyll"), "");

          // 1. Git LFS rules for deployment
          const gitattributesContent = `books/html/fnafi/* filter=lfs diff=lfs merge=lfs -text\nbooks/html/fnafi3/* filter=lfs diff=lfs merge=lfs -text\n*.zip filter=lfs diff=lfs merge=lfs -text\n*.wasm filter=lfs diff=lfs merge=lfs -text\n`;
          fs.writeFileSync(path.join(distDir, ".gitattributes"), gitattributesContent);

          // 2. Copy all directories and files
          const assetFiles = ["manifest.webmanifest", "sw.js"];
          const assetDirs = ["__rv", "books", "data", "help", "icons", "linux", "os", "reviews", "status", "wallpapers"];

          for (const file of assetFiles) {
            if (fs.existsSync(file)) fs.copyFileSync(file, path.join(distDir, file));
          }

          for (const dir of assetDirs) {
            if (fs.existsSync(dir)) fs.cpSync(dir, path.join(distDir, dir), { recursive: true });
          }

          // Copy scripts inside __rv directly to distDir root so root lookups find them
          if (fs.existsSync("__rv")) {
            for (const item of fs.readdirSync("__rv")) {
              const srcItem = path.join("__rv", item);
              const destItem = path.join(distDir, item);
              if (fs.statSync(srcItem).isFile()) {
                fs.copyFileSync(srcItem, destItem);
              }
            }
          }

          // 3. Read template index.html and fix absolute slash paths
          if (!fs.existsSync("index.html")) {
            console.error("Error: index.html not found!");
            process.exit(1);
          }
          let baseHtml = fs.readFileSync("index.html", "utf8");

          const repoName = process.env.GITHUB_REPOSITORY ? process.env.GITHUB_REPOSITORY.split("/")[1] : "5k-links-10-8-2026-v2";
          const repoPrefix = `/${repoName}/`;

          // Convert "/manifest.webmanifest" -> "/5k-links-10-8-2026-v2/manifest.webmanifest"
          baseHtml = baseHtml.replace(/(href|src)=["']\/(?!\/)(.*?)["']/gi, `$1="${repoPrefix}$2"`);

          // Ensure base tag is present
          if (!baseHtml.includes("<base ")) {
            baseHtml = baseHtml.replace(/<head([^>]*)>/i, `<head$1>\n    <base href="${repoPrefix}">`);
          }

          // 4. Generate 5,000 unique paths
          const TOTAL_PAGES = 5000;
          const chars = "abcdefghijklmnopqrstuvwxyz0123456789";

          function getRandomSegment(minLen = 4, maxLen = 10) {
            const length = Math.floor(Math.random() * (maxLen - minLen + 1)) + minLen;
            let segment = "";
            for (let i = 0; i < length; i++) {
              segment += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return segment;
          }

          function getNestedPath(minSegments = 2, maxSegments = 4) {
            const depth = Math.floor(Math.random() * (maxSegments - minSegments + 1)) + minSegments;
            const segments = [];
            for (let i = 0; i < depth; i++) {
              segments.push(getRandomSegment(4, 10));
            }
            return segments.join("/");
          }

          const uniquePaths = new Set();
          while (uniquePaths.size < TOTAL_PAGES) {
            uniquePaths.add(getNestedPath(2, 4));
          }

          let masterLinksHtml = "";

          // Write each of the 5,000 subfolder pages
          for (const nestedPath of uniquePaths) {
            const folderPath = path.join(distDir, nestedPath);
            fs.mkdirSync(folderPath, { recursive: true });

            fs.writeFileSync(path.join(folderPath, "index.html"), baseHtml);
            masterLinksHtml += `<a class="card" href="./${nestedPath}/">${nestedPath}</a>\n`;
          }

          // 5. Main landing page: displays the 5,000 links
          const masterIndexHtml = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Directory Index</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: #0d1117;
                color: #c9d1d9;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              header { text-align: center; margin-bottom: 28px; max-width: 650px; width: 100%; }
              h1 { font-size: 28px; font-weight: 700; color: #f0f6fc; margin-bottom: 8px; }
              p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
              .search-box {
                width: 100%; padding: 12px 18px; border-radius: 8px; border: 1px solid #30363d;
                background: #161b22; color: #f0f6fc; font-size: 15px; outline: none;
              }
              .search-box:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2); }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; width: 100%; max-width: 1300px; }
              .card {
                display: flex; align-items: center; justify-content: center; background: #161b22;
                border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: #58a6ff;
                text-decoration: none; font-size: 12px; font-family: monospace; word-break: break-all; text-align: center;
              }
              .card:hover { background: #21262d; border-color: #58a6ff; color: #79c0ff; transform: translateY(-2px); }
              .hidden { display: none !important; }
            </style>
          </head>
          <body>
            <header>
              <h1>Directory Index</h1>
              <p>5,000 Nested Pages</p>
              <input type="text" id="filter" class="search-box" placeholder="Quick find path..." autocomplete="off" />
            </header>
            <main class="grid" id="link-grid">${masterLinksHtml}</main>
            <script>
              const filter = document.getElementById("filter");
              const links = document.querySelectorAll(".card");
              filter.addEventListener("input", (e) => {
                const term = e.target.value.toLowerCase().trim();
                links.forEach(card => {
                  card.classList.toggle("hidden", !card.textContent.toLowerCase().includes(term));
                });
              });
            </script>
          </body>
          </html>`;

          // This makes the main URL display the 5k links directory directly
          fs.writeFileSync(path.join(distDir, "index.html"), masterIndexHtml);
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_deploy
          enable_jekyll: false
