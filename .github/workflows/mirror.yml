name: Scrape Assets Directly to Repo Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scrape and Discover Assets Directly in Root
        run: |
          BASE="https://ixl.com.pulsaudio.ro"

          echo "Fetching primary files..."
          wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/index.html" || true
          wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/manifest.webmanifest" || true
          wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/sw.js" || true
          wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/data/apps.json" || true
          wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/books/books.json" || true

          echo "Extracting catalogue targets..."
          mkdir -p target_lists
          > target_lists/urls.txt

          if [ -f "data/apps.json" ]; then
            grep -o -E '[a-zA-Z0-9_\-\./]+\.(html|png|webp|jpg|js|css|json)' data/apps.json \
              | sed 's|^/||' >> target_lists/urls.txt
          fi

          if [ -f "books/books.json" ]; then
            grep -o -E '[a-zA-Z0-9_\-\./]+\.(html|png|webp|jpg|json)' books/books.json \
              | sed 's|^/||' >> target_lists/urls.txt
          fi

          sort -u target_lists/urls.txt -o target_lists/urls.txt

          echo "Downloading $(wc -l < target_lists/urls.txt) catalogue assets in parallel..."
          cat target_lists/urls.txt | xargs -n 1 -P 16 -I {} wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/{}" || true

          echo "Scanning JS, HTML, and CSS for nested assets..."
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" \) -not -path '*/.*' \
            -exec grep -o -E '([a-zA-Z0-9_\-\./]+)\.(js|css|json|wasm|data|png|jpg|jpeg|webp|svg|webm|mp3|ogg|wav)' {} + \
            | awk -F: '{print $2}' \
            | sed -e 's/^[ \t]*//' -e "s/[\"']//g" -e 's|^/||' \
            | grep -v -E '^(http|https|//)' \
            | sort -u > target_lists/nested.txt

          echo "Downloading $(wc -l < target_lists/nested.txt) nested assets in parallel..."
          cat target_lists/nested.txt | xargs -n 1 -P 16 -I {} wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/{}" || true

          rm -rf target_lists

          # Setup local client routing stubs
          for route in os reviews linux help; do
            mkdir -p "$route"
            [ -f index.html ] && cp index.html "$route/index.html"
          done

      - name: Commit and Push Directly to Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-scrape web portal assets into repository root"
            git push
          fi
