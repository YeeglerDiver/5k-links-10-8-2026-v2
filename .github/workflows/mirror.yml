name: Scrape and Push Exact Assets Directly to Root (Git LFS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Exact Discovered Production Assets
        run: |
          BASE="https://ixl.com.pulsaudio.ro"

          # 1. Download core shell, manifest, and service worker
          echo "Fetching core entrypoints..."
          wget -q -nc -x -nH "$BASE/index.html" || true
          wget -q -nc -x -nH "$BASE/manifest.webmanifest" || true
          wget -q -nc -x -nH "$BASE/sw.js" || true
          wget -q -nc -x -nH "$BASE/data/apps.json" || true
          wget -q -nc -x -nH "$BASE/books/books.json" || true

          # 2. Download verified production dist bundles
          echo "Fetching verified production dist bundles..."
          mkdir -p dist
          FILES=(
            "dist/9a798f66f2e03e.js"
            "dist/3889b96ea88650.js"
            "dist/66236a7092d278.js"
            "dist/c1fd2a6a0c7365.js"
            "dist/ca6099c23c59cd.js"
            "dist/facda17da395a2.js"
            "dist/0f7a354189db53.js"
            "dist/8c0ecdafe638c8.js"
            "dist/669abb686c9d53.js"
            "dist/9668f797eb0601.js"
            "dist/d7feb34116dbd4.js"
            "dist/f84b10d0eed54d.js"
            "dist/eb7576df1f1bc2.css"
          )
          for file in "${FILES[@]}"; do
            wget -q -nc -x -nH "$BASE/$file" || true
          done

          # 3. Download visual assets
          echo "Fetching visual assets..."
          mkdir -p wallpapers icons data/img/apps
          wget -q -nc -x -nH "$BASE/wallpapers/nightfall.webp" || true
          wget -q -nc -x -nH "$BASE/wallpapers/aurora.webp" || true
          wget -q -nc -x -nH "$BASE/icons/favicon-32.png" || true
          wget -q -nc -x -nH "$BASE/icons/favicon.svg" || true
          wget -q -nc -x -nH "$BASE/icons/icon-192.png" || true
          wget -q -nc -x -nH "$BASE/data/img/apps/linux.png" || true

          # 4. Extract catalog entries from JSON files and download in parallel
          echo "Processing game catalog links..."
          mkdir -p target_lists
          > target_lists/urls.txt

          if [ -f "data/apps.json" ]; then
            grep -o -E '[a-zA-Z0-9_\-\./]+\.(html|png|webp|jpg|js|css|json)' data/apps.json \
              | sed 's|^/||' >> target_lists/urls.txt
          fi

          if [ -f "books/books.json" ]; then
            grep -o -E '[a-zA-Z0-9_\-\./]+\.(html|png|webp|jpg|json)' books/books.json \
              | sed 's|^/||' >> target_lists/urls.txt
          fi

          sort -u target_lists/urls.txt -o target_lists/urls.txt
          cat target_lists/urls.txt | xargs -n 1 -P 16 -I {} wget -q -nc -x -nH --tries=1 --timeout=5 "$BASE/{}" || true
          rm -rf target_lists

          # 5. Set up fallback routing directories and dummy API responses
          echo "Configuring routing fallbacks and stubs..."
          for route in os reviews linux help; do
            mkdir -p "$route"
            [ -f index.html ] && cp index.html "$route/index.html"
          done

          mkdir -p __rv status
          echo '{"version":"1.0.0"}' > __rv/version
          echo '{"status":"ok"}' > status/ping

      - name: Track Large Files and Push with Git LFS
        run: |
          # Initialize Git LFS on the runner
          git lfs install

          # Find any file over 50MB and add it to Git LFS tracking
          find . -type f -size +50M -not -path '*/.*' | while read -r large_file; do
            clean_name=$(echo "$large_file" | sed 's|^\./||')
            echo "Tracking large file via LFS: $clean_name"
            git lfs track "$clean_name"
          done

          # Stage .gitattributes first so LFS rules take effect
          git add .gitattributes

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scrape and store full site assets with Git LFS"
            git push origin main
          fi
